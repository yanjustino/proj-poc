kind: ApplicationWorkflow
spec:
  requiredSkills:
    - PostgresQuery
    - EmptyValidation
    - OutputTransformer
  routes:
    consultaCliente:
      method: GET
      url: /clientes/$clienteId
      pathParameters:
        - name: clienteId
          type: uuid
          required: true
  behaviors:
    consultaCliente:
      - name: ConsultarCliente
        kind: PostgresQuery
        postgresQuery:
          resultType: Item
          sql: "SELECT id, nome_completo
                FROM clientes WHERE id = $1"
          parameters: [ $clienteId ]
        onSuccess: NextStep
        onFailure:
          statusCode: 500
          message: "erro ao consultar cliente"
      - name: ValidarExistencia
        kind: EmptyValidation
        onSuccess: NextStep
        onFailure:
          statusCode: 404
          message: "cliente não encontrado"
      - name: TransformarResposta
        kind: OutputTransformer
        fields:
          - from: id
            to: clienteId
          - from: nome_completo
            to: nome
        onSuccess: Finish
        onFailure:
          statusCode: 500
          message: "erro ao transformar dados"
